<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a1a19">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NBA Props">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>NBA Props</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f2ee;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6e69;
  --line:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);--chip:#ebeae4;
  --accent:#2a78d6;--goodtxt:#006300;--good:#0ca30c;--bad:#d03b3b;--warn:#fab219;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#111110;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#9a9993;
    --line:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--chip:#262624;
    --accent:#3987e5;--goodtxt:#0ca30c;--good:#0ca30c;--bad:#d03b3b;--warn:#fab219;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 28px)}
header h1{font-size:22px;margin:0;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:13px;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.tile{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 0 0 1px var(--ring)}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.note{font-size:12px;color:var(--muted);margin:4px 2px 0}
.pos{color:var(--goodtxt)} .neg{color:var(--bad)}
.tabs{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin:16px 0 12px;position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:5}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14px;font-weight:600;padding:8px 0;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--ring)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{border:0;background:var(--chip);color:var(--ink2);font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.toggle{margin-left:auto;font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 0 0 1px var(--ring)}
.card.dim{opacity:.6}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-weight:650}
.meta{color:var(--muted);font-size:13px}
.pick{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.side{font-size:18px;font-weight:700;letter-spacing:-.01em}
.odds{color:var(--ink2);font-weight:600;font-size:14px;margin-left:6px}
.edge{font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink2);font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.flag{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink)}
.flag i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
details{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:10px;box-shadow:0 0 0 1px var(--ring)}
summary{cursor:pointer;font-weight:600;font-size:14px}
details p{margin:6px 0 0;font-size:13px;color:var(--ink2)}
.day{font-size:13px;font-weight:650;color:var(--muted);margin:14px 2px 6px}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:6px;box-shadow:0 0 0 1px var(--ring)}
.badge{min-width:30px;text-align:center;font-size:12px;font-weight:700;padding:3px 6px;border-radius:6px;color:#fff}
.badge.W{background:var(--good)} .badge.L{background:var(--bad)} .badge.P{background:var(--axis);color:var(--ink)}
.res .what{font-size:13px;color:var(--ink2)}
.amt{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.panel{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 0 0 1px var(--ring)}
.panel h2{font-size:14px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:600;text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.chartbox{position:relative}
svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);display:none}
.empty{color:var(--muted);text-align:center;padding:28px 8px;font-size:14px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NBA Props</h1>
    <div class="sub" id="sub"></div>
  </header>
  <div class="tiles" id="tiles"></div>
  <div class="note" id="tilenote"></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="tonight" aria-selected="true">Tonight</button>
    <button role="tab" data-tab="results" aria-selected="false">Results</button>
    <button role="tab" data-tab="stats" aria-selected="false">Stats</button>
  </div>

  <section id="tonight"></section>
  <section id="results" hidden></section>
  <section id="stats" hidden></section>

  <div class="foot">Paper trading only. Model picks vs DraftKings lines.</div>
</div>

<script>
const raw = document.getElementById("data").textContent.trim();
const D = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(raw), c => c.charCodeAt(0))));

const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (x, d = 1) => x == null ? "–" : (x * 100).toFixed(d) + "%";
const sgn = (x, d = 2, suf = "u") => x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d) + suf;
const odds = o => o == null ? "" : (o > 0 ? "+" + o : String(o)).replace("-", "−");
const cls = x => x > 0 ? "pos" : x < 0 ? "neg" : "";
const fmtDate = s => new Date(s + "T12:00:00").toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric"});

/* header + tiles */
document.getElementById("sub").textContent = fmtDate(D.game_date) + " · updated " + D.updated;
const S = D.summary;
const tiles = [
  ["Record", S.bets ? `${S.W}–${S.L}${S.push ? "–" + S.push : ""}` : "–", ""],
  ["Units", S.bets ? sgn(S.units) : "–", cls(S.units)],
  ["ROI", S.bets ? (S.roi > 0 ? "+" : "") + pct(S.roi) : "–", cls(S.roi)],
  ["Hit rate", S.bets ? pct(S.hit) : "–", ""],
];
document.getElementById("tiles").replaceChildren(...tiles.map(([k, v, c]) => {
  const t = el("div", "tile"); t.append(el("div", "k", k), el("div", "v " + c, esc(v))); return t;
}));
document.getElementById("tilenote").textContent = S.bets
  ? `${S.bets} graded bets · luck band ±${pct(S.band, 0)} ROI · break-even hit rate at −110 is 52.4%`
  : "No graded bets yet. Results appear the day after the first picks.";

/* tabs */
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  ["tonight", "results", "stats"].forEach(id => document.getElementById(id).hidden = id !== b.dataset.tab);
  if (b.dataset.tab === "stats") drawChart();
}));

/* TONIGHT */
let statFilter = "ALL", showAll = false;
function renderTonight() {
  const box = document.getElementById("tonight");
  box.replaceChildren();
  const outTeams = Object.entries(D.out || {});
  if (outTeams.length) {
    const det = el("details");
    det.append(el("summary", "", `Out tonight (${outTeams.reduce((n, [, v]) => n + v.length, 0)})`));
    outTeams.forEach(([t, names]) => det.append(el("p", "", `<b>${esc(t)}</b> ${esc(names.join(", "))}`)));
    box.append(det);
  }
  const bar = el("div", "row");
  ["ALL", "PTS", "REB", "AST"].forEach(s => {
    const c = el("button", "chip", s === "ALL" ? "All" : s);
    c.setAttribute("aria-pressed", s === statFilter);
    c.onclick = () => { statFilter = s; renderTonight(); };
    bar.append(c);
  });
  const tg = el("label", "toggle", `<input type="checkbox" ${showAll ? "checked" : ""}> All lines`);
  tg.querySelector("input").onchange = e => { showAll = e.target.checked; renderTonight(); };
  bar.append(tg);
  box.append(bar);

  let rows = (D.tonight || []).filter(r => statFilter === "ALL" || r.stat === statFilter);
  if (!showAll) rows = rows.filter(r => r.pick);
  rows.sort((a, b) => (b.pick ? 1 : 0) - (a.pick ? 1 : 0) || Math.abs(b.edge) - Math.abs(a.edge));
  if (!rows.length) {
    box.append(el("div", "empty", (D.tonight || []).length ? "No picks match this filter." : "No lines for tonight yet."));
    return;
  }
  rows.forEach(r => {
    const c = el("div", "card" + (r.pick ? "" : " dim"));
    const top = el("div", "top");
    top.append(el("div", "name", esc(r.player)), el("div", "meta", `${esc(r.team)} ${r.home ? "vs" : "@"} ${esc(r.opponent)}`));
    const pk = el("div", "pick");
    const sideTxt = r.pick ? `${r.pick} ${r.line} ${r.stat}` : `No bet · ${r.line} ${r.stat}`;
    const o = r.pick === "OVER" ? r.over_odds : r.pick === "UNDER" ? r.under_odds : null;
    const edge = r.pick === "UNDER" ? -r.edge : r.edge;
    pk.append(el("div", "", `<span class="side">${esc(sideTxt)}</span>${o != null ? `<span class="odds">${odds(o)}</span>` : ""}`),
              el("div", "edge " + (r.pick ? "pos" : ""), (edge > 0 ? "+" : "") + pct(edge) + " edge"));
    const pOver = r.pick === "UNDER" ? 1 - r.p_over : r.p_over, mOver = r.pick === "UNDER" ? 1 - r.mkt_over : r.mkt_over;
    const st = el("div", "stats", `<span>Proj <b>${r.proj.toFixed(1)}</b></span><span>Model ${pct(pOver, 0)}</span><span>Market ${pct(mOver, 0)}</span>`);
    if (r.inj_status) st.append(el("span", "flag", `<i></i>${esc(r.inj_status)}`));
    c.append(top, pk, st);
    box.append(c);
  });
}

/* RESULTS */
function renderResults() {
  const box = document.getElementById("results");
  const rows = D.results || [];
  if (!rows.length) { box.append(el("div", "empty", "Graded bets will show up here.")); return; }
  let day = null;
  rows.forEach(r => {
    if (r.game_date !== day) {
      day = r.game_date;
      const dayRows = rows.filter(x => x.game_date === day);
      const u = dayRows.reduce((s, x) => s + (x.profit || 0), 0);
      box.append(el("div", "day", `${fmtDate(day)} · <span class="${cls(u)}">${sgn(u)}</span>`));
    }
    const b = r.result === "push" ? "P" : r.profit > 0 ? "W" : "L";
    const line = el("div", "res");
    line.append(el("span", "badge " + b, b === "P" ? "Push" : b),
                el("div", "", `<div class="name">${esc(r.player)}</div><div class="what">${esc(r.pick)} ${r.line} ${esc(r.stat)} · actual ${r.actual}</div>`),
                el("div", "amt " + cls(r.profit), sgn(r.profit)));
    box.append(line);
  });
}

/* STATS */
function renderStats() {
  const box = document.getElementById("stats");
  const p1 = el("div", "panel");
  p1.append(el("h2", "", "Cumulative units"));
  const cb = el("div", "chartbox"); cb.id = "chartbox";
  p1.append(cb);
  box.append(p1);

  const p2 = el("div", "panel");
  p2.append(el("h2", "", "Breakdown"));
  const groups = D.breakdown || [];
  if (groups.length) {
    const t = el("table");
    t.innerHTML = "<thead><tr><th>Group</th><th>Bets</th><th>W–L</th><th>Hit</th><th>Units</th><th>ROI</th></tr></thead>";
    const tb = el("tbody");
    groups.forEach(g => {
      const tr = el("tr");
      tr.innerHTML = `<td>${esc(g.group)}</td><td>${g.bets}</td><td>${g.W}–${g.L}</td><td>${pct(g.hit)}</td>` +
                     `<td class="${cls(g.units)}">${sgn(g.units)}</td><td class="${cls(g.roi)}">${pct(g.roi)}</td>`;
      tb.append(tr);
    });
    t.append(tb); p2.append(t);
  } else p2.append(el("div", "empty", "Not enough bets yet."));
  box.append(p2);

  const p3 = el("div", "panel");
  p3.append(el("h2", "", "Model vs. DraftKings"));
  const mv = D.model_vs_market;
  if (mv) {
    const better = mv.model < mv.market;
    p3.append(el("div", "", `<table><tbody>
      <tr><td>Graded lines</td><td>${mv.n}</td></tr>
      <tr><td>Model log loss</td><td>${mv.model.toFixed(4)}</td></tr>
      <tr><td>DraftKings log loss</td><td>${mv.market.toFixed(4)}</td></tr></tbody></table>
      <p class="note">${better ? "Model is the better forecaster so far (lower is better)." : "DraftKings is the better forecaster so far (lower is better)."} Needs a few hundred lines to mean much.</p>`));
  } else p3.append(el("div", "empty", "Appears after 20 graded lines."));
  box.append(p3);
}

let chartDrawn = false;
function drawChart() {
  if (chartDrawn) return; chartDrawn = true;
  const box = document.getElementById("chartbox");
  const pts = D.cumulative || [];
  if (pts.length < 2) { box.append(el("div", "empty", "The chart starts after a couple of graded bets.")); return; }
  const W = 520, H = 220, m = {l: 38, r: 10, t: 12, b: 24};
  const ys = pts.map(p => p.units), lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
  const span = hi - lo || 1, step = [0.5, 1, 2, 5, 10, 20, 50].find(s => span / s <= 5) || 100;
  const y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
  const X = i => m.l + (W - m.l - m.r) * (i / (pts.length - 1));
  const Y = v => m.t + (H - m.t - m.b) * (1 - (v - y0) / ((y1 - y0) || 1));
  const css = getComputedStyle(document.documentElement);
  const col = n => css.getPropertyValue(n).trim();
  let g = "";
  for (let v = y0; v <= y1 + 1e-9; v += step) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 0 ? col("--axis") : col("--line")}" stroke-width="1"/>`;
    g += `<text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="${col("--muted")}">${v > 0 ? "+" : ""}${+v.toFixed(1)}</text>`;
  }
  g += `<text x="${m.l}" y="${H - 6}" font-size="11" fill="${col("--muted")}">bet 1</text>`;
  g += `<text x="${W - m.r}" y="${H - 6}" text-anchor="end" font-size="11" fill="${col("--muted")}">bet ${pts.length}</text>`;
  const d = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.units).toFixed(1)).join(" ");
  g += `<path d="${d}" fill="none" stroke="${col("--accent")}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<line id="xh" y1="${m.t}" y2="${H - m.b}" stroke="${col("--axis")}" stroke-width="1" visibility="hidden"/>`;
  g += `<circle id="dot" r="4.5" fill="${col("--accent")}" stroke="${col("--card")}" stroke-width="2" visibility="hidden"/>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative units over ${pts.length} bets, now ${sgn(ys[ys.length - 1])}">${g}</svg><div class="tip" id="tip"></div>`;
  const svg = box.querySelector("svg"), xh = svg.querySelector("#xh"), dot = svg.querySelector("#dot"), tip = box.querySelector("#tip");
  const move = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((sx - m.l) / (W - m.l - m.r) * (pts.length - 1))));
    const p = pts[i];
    xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i)); xh.setAttribute("visibility", "visible");
    dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(p.units)); dot.setAttribute("visibility", "visible");
    tip.innerHTML = `Bet ${i + 1} · ${fmtDate(p.date)}<br><b>${sgn(p.units)}</b> total`;
    tip.style.left = Math.max(60, Math.min(r.width - 60, X(i) * r.width / W)) + "px";
    tip.style.top = (Y(p.units) * r.height / H - 10) + "px";
    tip.style.display = "block";
  };
  const hide = () => { xh.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.style.display = "none"; };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", hide);
}

renderTonight(); renderResults(); renderStats();
</script>
</body>
